name: Set up the workspace
description: Installs pnpm, Node, and the workspace from its lockfile, then builds every package. Run after checkout.

inputs:
  node-version:
    description: The Node.js version to set up.
    required: true

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6.0.6
    - uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
    - shell: bash
      run: pnpm build
