name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6.0.6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile

      - name: Verify
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm verify

  docs:
    name: docs-builder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assemble package docs
        run: node scripts/assemble_package_docs.js
      - name: Build documentation
        uses: elastic/docs-builder@ff858942fc9015cdc618282aa41118823624e118 # 1.60.0
