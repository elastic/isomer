name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6.0.6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playwright-chromium

      - name: Verify
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm verify

      # `verify` has built every package; the site artifact is a downloadable preview of the PR.
      - name: Check and build the slides Studio
        if: ${{ !cancelled() && matrix.node == 24 && steps.install.outcome == 'success' }}
        uses: ./.github/actions/isomer-studio
        with:
          config: packages/isomer-primitives-slides/isomer-studio.config.ts
          out: .artifacts/studio
          report: .artifacts/studio-report.xml
          artifact-name: slides-studio

  docs:
    name: docs-builder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check assembled package docs are committed
        run: node scripts/assemble_package_docs.js --check
      - name: Build documentation
        uses: elastic/docs-builder@main
