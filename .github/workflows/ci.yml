name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `static`, `test`, `browser`, and `studio-consumer` split `pnpm verify` across parallel jobs: together they run every
# script it runs. Keep them in step with it. `peers` runs what depends on Node and the peers at the other versions.
jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: setup
        uses: ./.github/actions/setup-workspace
        with:
          node-version: 24
      - run: pnpm verify:static
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm verify:packed

  test:
    name: test (${{ matrix.project }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: [node, studio]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: 24
      - run: pnpm vitest run --project ${{ matrix.project }}

  browser:
    name: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: setup
        uses: ./.github/actions/setup-workspace
        with:
          node-version: 24
      - uses: ./.github/actions/playwright-chromium
      - run: pnpm test:browser
      - name: Upload browser test traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-traces
          path: test-results/
          if-no-files-found: ignore

  # Builds the PR head itself, not the merge ref, so the artifact is exactly what was pushed.
  studio:
    name: Studio preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: 24
      - uses: ./.github/actions/playwright-chromium
      - uses: ./.github/actions/isomer-studio
        with:
          config: isomer-studio.config.ts
          out: .artifacts/studio
          base: /studio/
          report: .artifacts/studio-report.xml
          artifact-name: studio-${{ env.HEAD_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Test the built Studio
        env:
          STUDIO_BROWSER_ONLY_SITE: .artifacts/studio
        run: pnpm test:browser studio.spec.ts --grep 'browser-only static build'
      - name: Upload browser test traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: studio-browser-traces-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore

  # A consumer installs the packed Studio with npm and runs it on its own Node, so this runs at the `engines` floor.
  studio-consumer:
    name: studio-consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: 22.13.0
      - uses: ./.github/actions/playwright-chromium
      - run: pnpm check:studio-consumer

  peers:
    name: peers (${{ matrix.target }}, node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The `engines` floor of every published package.
          - target: floor
            node: 22.13.0
          # Tracks the `.nvmrc` of elastic/kibana on `main`.
          - target: kibana
            node: 24.22.1
          - target: latest
            node: 26
    steps:
      - uses: actions/checkout@v5
      # Packages build against the lockfile, as the release does; the target swaps what they run and compile against.
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/apply_peer_target.js ${{ matrix.target }}
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter './packages/*' --filter '!@elastic/isomer-studio' typecheck
      - run: pnpm vitest run --project node
      - run: pnpm check:pack-consumer

  # The one check branch protection requires for the jobs `pnpm verify` is split into.
  verify:
    name: verify
    if: ${{ !cancelled() }}
    needs: [static, test, browser, studio-consumer]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::A required job finished with '$result'."
              exit 1
            fi
          done

  docs:
    name: docs-builder
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Check assembled package docs are committed
        run: node scripts/assemble_package_docs.js --check
      - name: Build documentation
        uses: elastic/docs-builder@main
