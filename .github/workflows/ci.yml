name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', 22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6.0.6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playwright-chromium

      - name: Verify
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm verify

      - name: Upload browser test traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-traces-node-${{ matrix.node }}
          path: test-results/
          if-no-files-found: ignore

  # Builds the PR head itself, not the merge ref, so the artifact is exactly what was pushed.
  studio:
    name: Studio preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playwright-chromium
      - run: pnpm build
      - uses: ./.github/actions/isomer-studio
        with:
          config: isomer-studio.config.ts
          out: .artifacts/studio
          base: /studio/
          report: .artifacts/studio-report.xml
          artifact-name: studio-${{ env.HEAD_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: ./.github/actions/isomer-studio
        with:
          config: packages/isomer-renderers-elastic-charts/isomer-studio.config.ts
          out: .artifacts/studio-charts
          base: /studio-charts/
          report: .artifacts/studio-charts-report.xml
          artifact-name: studio-charts-${{ env.HEAD_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Test the built Studio
        env:
          STUDIO_BROWSER_ONLY_SITE: .artifacts/studio
        run: pnpm test:browser studio.spec.ts --grep 'browser-only static build'
      - name: Upload browser test traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: studio-browser-traces-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore

  peers:
    name: peers (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [floor, kibana, latest]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6.0.6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Packages build against the lockfile, as the release does; the target swaps what they run and compile against.
      - run: pnpm build
      - run: node scripts/apply_peer_target.js ${{ matrix.target }}
      - run: pnpm install --no-frozen-lockfile
      # The Studio pins React 18 until EUI allows 19.
      - run: pnpm --filter './packages/*' --filter '!@elastic/isomer-studio' typecheck
      - run: pnpm vitest run --project node
      - run: pnpm check:pack-consumer

  docs:
    name: docs-builder
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Check assembled package docs are committed
        run: node scripts/assemble_package_docs.js --check
      - name: Build documentation
        uses: elastic/docs-builder@main
