name: docs-preview

on:
  workflow_run:
    workflows: [docs]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preview:
    name: Deploy PR preview
    # A workflow_run job always runs the version of this file committed to
    # the repository's default branch, never the triggering branch's own
    # copy -- unlike a job triggered directly by pull_request, which runs
    # with whatever that PR's own branch currently has in .github/workflows.
    # That's the whole reason this is a separate workflow: it's the only way
    # to hand out contents:write/pull-requests:write for a same-repo PR
    # build without letting that PR's own branch redefine what those
    # permissions get used for.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
      pages: read
    env:
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
    steps:
      - uses: actions/checkout@v5
      - name: Determine current PR state
        # workflow_run.pull_requests carries only the minimal PR record
        # (url/id/number/head/base) -- no state -- so ask the API for it in
        # this trusted job rather than trusting anything from the triggering
        # (PR-branch-controlled) run.
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state="$(gh api "repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}" --jq .state)"
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Download built site
        if: steps.pr.outputs.state == 'open'
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine live Pages URL
        # Re-derive this from the API in this trusted job rather than
        # trusting anything computed by docs.yml's build job: that job runs
        # unprivileged, but still executes the PR branch's own code, so a
        # value it handed across (e.g. via an artifact) could be an
        # attacker-chosen host that only looks syntactically valid. Only a
        # value this job fetches itself is safe to hand to pr-preview-action,
        # which publishes it as the bot's own sticky-comment link.
        id: pages
        if: steps.pr.outputs.state == 'open'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          html_url="$(gh api "repos/${{ github.repository }}/pages" --jq .html_url 2>/dev/null || true)"
          if [[ -n "$html_url" ]]; then
            rest="${html_url#*://}"
            host="${rest%%/*}"
            if [[ "$rest" == */* ]]; then
              path="${rest#*/}"
              path="${path%/}"
            else
              path=""
            fi
          elif [[ "${{ github.event.repository.private }}" == "true" ]]; then
            host="${{ github.repository_owner }}.github.io"
            path=""
          else
            host="${{ github.repository_owner }}.github.io"
            path="${{ github.event.repository.name }}"
          fi
          # pr-preview-action checks that pages-base-path literally prefixes
          # where it deploys (umbrella-dir/pr-<n>, always relative to the
          # branch root) and silently ignores it otherwise -- our content is
          # never nested under a matching path on the branch itself, so a
          # separate pages-base-path would always fail that check. Fold the
          # path into the base URL instead, which is a plain string prefix
          # with no such validation.
          echo "url=${host}${path:+/$path}" >> "$GITHUB_OUTPUT"
      - name: Ensure root .nojekyll on gh-pages
        # .nojekyll only disables Jekyll (which drops _static/ and every
        # other underscore-prefixed path) when it sits at the branch root --
        # a copy nested under pr-preview/pr-<n>/ has no effect. The main
        # publish job seeds this too, but that only runs once something
        # merges to main, which previews can't wait on.
        if: steps.pr.outputs.state == 'open'
        run: mkdir -p /tmp/nojekyll-only && touch /tmp/nojekyll-only/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        if: steps.pr.outputs.state == 'open'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/nojekyll-only
          keep_files: true
      - name: Deploy or remove preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: site
          umbrella-dir: pr-preview
          pr-number: ${{ env.PR_NUMBER }}
          action: ${{ steps.pr.outputs.state == 'open' && 'deploy' || 'remove' }}
          pages-base-url: ${{ steps.pages.outputs.url }}
