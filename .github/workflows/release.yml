name: Publish a Release

# Trusted publishing is bound to this file, so snapshots publish from here too.
on:
  # The Changes job gates snapshots with the same rule that decides which commits cut a release.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (do not publish)
        required: true
        type: boolean
        default: true
      snapshot:
        description: Skip semantic-release and publish a snapshot of every published package from this commit under the next dist-tag
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.snapshot }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playwright-chromium
      - run: pnpm verify
      # pnpm 10 delegates `pnpm publish` to the ambient npm CLI. Trusted publishing needs npm >= 11.5.1; Node 22 ships 10.
      - run: npm install -g npm@^11.5.1
      # Nothing is committed back to main: git tags track the version and the notes live on the
      # GitHub Release. See CHANGELOG.md.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm semantic-release ${{ inputs.dry_run && '--dry-run' || '' }}

  changes:
    name: Changes
    if: ${{ github.event_name == 'push' || inputs.snapshot }}
    runs-on: ubuntu-latest
    outputs:
      ships: ${{ steps.ships.outputs.ships }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      # A dispatch has no `before`, so it always ships.
      - id: ships
        env:
          BEFORE: ${{ github.event.before }}
        run: node scripts/publish_snapshot.js --since "$BEFORE" >> "$GITHUB_OUTPUT"

  snapshot:
    name: Snapshot
    needs: changes
    if: ${{ needs.changes.outputs.ships == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-snapshot
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playwright-chromium
      - run: pnpm verify
      # pnpm 10 delegates `pnpm publish` to the ambient npm CLI. Trusted publishing needs npm >= 11.5.1; Node 22 ships 10.
      - run: npm install -g npm@^11.5.1
      # A prerelease under `next`; no tag, commit, or GitHub Release. See RELEASING.md.
      - name: Publish a snapshot
        run: node scripts/publish_snapshot.js ${{ inputs.dry_run && '--dry-run' || '' }}
