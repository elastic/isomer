# Elastic Internal Docs (Codex) builds. This file's path is bound to the
# token-policy-push-codex-link-index-isomer policy in elastic/catalog-info, so
# do not rename it.
name: elastic-internal-docs-build

on:
  push:
    branches:
      - main
  pull_request: ~

concurrency:
  group: codex-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-slim
    outputs:
      docs_modified: ${{ steps.check-docs.outputs.any_modified }}
    steps:
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check documentation changes
        id: check-docs
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            docs/**
            packages/*/docs/**
          files_ignore: |
            .github/**
            README.md

  build-preview:
    if: github.event_name == 'pull_request'
    needs: check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Assemble package docs
        run: node scripts/assemble_package_docs.js
      - uses: elastic/docs-actions/codex/build@v1

  build-main:
    if: github.event_name == 'push' && needs.check.outputs.docs_modified == 'true'
    needs: check
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Assemble package docs
        run: node scripts/assemble_package_docs.js
      - uses: elastic/docs-actions/codex/build@v1

  update-link-index:
    if: github.event_name == 'push' && needs.check.outputs.docs_modified == 'true'
    needs:
      - build-main
      - check
    permissions:
      id-token: write
    runs-on: ubuntu-slim
    steps:
      - uses: elastic/docs-actions/codex/update-link-index@v1
        with:
          codex-env: internal
