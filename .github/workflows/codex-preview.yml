# Elastic Internal Docs (Codex) previews and link-index updates. This file's
# path is bound to the token-policy-push-codex-link-index-isomer policy in
# elastic/catalog-info and to the vault role codex/build@v1 derives from it,
# so do not rename it.
#
# This inlines elastic/docs-actions/.github/workflows/codex-preview.yml@v1
# rather than calling it, so assemble_package_docs.js can run before the
# build: the reusable workflow checks out and builds in one step with no
# hook for a pack-docs assembly pass.
name: elastic-internal-docs

on:
  push:
    branches:
      - main
  pull_request: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check:
    permissions:
      pull-requests: read
      contents: read
    runs-on: ubuntu-slim
    outputs:
      any_modified: ${{ steps.check-files.outputs.any_modified }}
      all_changed_files: ${{ steps.check-files.outputs.all_changed_files }}
    steps:
      - name: Checkout
        if: contains(fromJSON('["push", "merge_group", "workflow_dispatch"]'), github.event_name)
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check changes
        id: check-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            docs/**
            packages/*/docs/**
            packages/**
            scripts/**
            isomer-studio.config.ts
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            tsconfig*.json
            .github/workflows/codex-preview.yml
            .github/actions/isomer-studio/**
          files_ignore: |
            README.md

  studio:
    needs: check
    if: needs.check.outputs.any_modified == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      STUDIO_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      STUDIO_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      STUDIO_BROWSER_BASE: /_preview/${{ github.repository }}/${{ github.event_name == 'pull_request' && format('pull/{0}', github.event.pull_request.number) || format('tree/{0}', github.ref_name) }}/studio/${{ github.event.pull_request.head.sha || github.sha }}/${{ github.run_id }}-${{ github.run_attempt }}/
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.STUDIO_HEAD_SHA }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playwright-chromium
      - run: pnpm build
      - uses: ./.github/actions/isomer-studio
        with:
          config: isomer-studio.config.ts
          out: .artifacts/studio
          base: ${{ env.STUDIO_BROWSER_BASE }}
          report: .artifacts/studio-report.xml
          artifact-name: studio-${{ env.STUDIO_HEAD_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          upload-site: 'false'
      - name: Record head build identity
        run: node scripts/studio_provenance.js .artifacts/studio
      - name: Browser-only artifact smoke check
        env:
          STUDIO_BROWSER_SITE: .artifacts/studio
        run: pnpm test:browser browser_only.spec.ts
      - name: Upload head Studio
        uses: actions/upload-artifact@v4
        with:
          name: studio-${{ env.STUDIO_HEAD_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/studio
          if-no-files-found: error
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-browser-failures-${{ env.STUDIO_HEAD_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
      - name: Review artifact
        env:
          REVIEW_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '### Browser-only Studio\nHead: `%s`\n\nRun: %s (attempt %s)\n\nExamples only; no live data. Forks can download and serve the artifact locally.\n' \
            "$STUDIO_HEAD_SHA" "$REVIEW_RUN" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: check
    outputs:
      path_prefix: ${{ steps.codex-build.outputs.path-prefix }}
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ needs.check.outputs.any_modified == 'true' && 'ubuntu-latest' || 'ubuntu-slim' }}
    steps:
      - name: Checkout code
        if: needs.check.outputs.any_modified == 'true'
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Assemble package docs
        if: needs.check.outputs.any_modified == 'true'
        run: node scripts/assemble_package_docs.js
      - uses: elastic/docs-actions/codex/build@v1
        if: needs.check.outputs.any_modified == 'true'
        id: codex-build
      - name: Warn about fork PR
        if: >
          startsWith(github.event_name, 'pull_request')
          && github.event.pull_request.head.repo.full_name != github.repository
          && needs.check.outputs.any_modified == 'true'
        run: |
          echo "::warning::Preview deployments are only available for PRs from the same repository, not from forks." \
            "Use the downloadable Studio artifact, or push an authorized branch to the upstream repository."
      - name: Skip build
        if: needs.check.outputs.any_modified == 'false'
        run: |
          echo "::warning::No changes detected, skipping build."

  deploy:
    if: >
      needs.check.outputs.any_modified == 'true'
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      id-token: write
      deployments: write
      actions: read
      pull-requests: read
    needs:
      - check
      - build
      - studio
    runs-on: ubuntu-latest
    steps:
      - name: Create Deployment
        uses: actions/github-script@v9
        id: deployment
        with:
          result-encoding: string
          script: |
            const { owner, repo } = context.repo;
            const prNumber = process.env.PR_NUMBER;
            const environment = 'codex-preview';
            const task = prNumber ? `codex-preview-${prNumber}` : undefined;
            const deployment = await github.rest.repos.createDeployment({
                owner,
                repo,
                environment,
                task,
                ref: process.env.REF,
                auto_merge: false,
                transient_environment: true,
                required_contexts: [],
            })
            await github.rest.repos.createDeploymentStatus({
                deployment_id: deployment.data.id,
                owner,
                repo,
                state: "in_progress",
                log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
            return deployment.data.id
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF: ${{ startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.sha || github.ref_name }}
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: docs
          path: docs
      - name: Reject symlinks in build output
        run: |
          if find docs -type l | grep -q .; then
            echo "::error::Symlinks found in build output — refusing to deploy"
            find docs -type l -ls
            exit 1
          fi
      - name: Download independently identified Studio archive
        uses: actions/github-script@v9
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const { createHash } = require('node:crypto');
            const { writeFileSync } = require('node:fs');
            const pr = await github.rest.pulls.get({
              ...context.repo, pull_number: context.payload.pull_request.number,
            });
            if (pr.data.state !== 'open' || pr.data.head.sha !== process.env.HEAD_SHA ||
                pr.data.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error('Studio preview is stale or no longer eligible.');
            }
            const run = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: context.runId,
            });
            if (run.data.event !== 'pull_request' ||
                run.data.path !== '.github/workflows/codex-preview.yml' ||
                run.data.repository.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                run.data.run_attempt !== Number(process.env.RUN_ATTEMPT)) {
              throw new Error('Unexpected Studio workflow identity.');
            }
            const name = `studio-${process.env.HEAD_SHA}-${context.runId}-${process.env.RUN_ATTEMPT}`;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: context.runId, per_page: 100,
            });
            const found = artifacts.filter(a => a.name === name && !a.expired);
            if (found.length !== 1 || !/^sha256:[a-f0-9]{64}$/.test(found[0].digest ?? '')) {
              throw new Error('Missing, ambiguous or unverifiable Studio artifact.');
            }
            const artifact = found[0];
            const archive = await github.rest.actions.downloadArtifact({
              ...context.repo, artifact_id: artifact.id, archive_format: 'zip',
            });
            const bytes = Buffer.from(archive.data);
            const digest = `sha256:${createHash('sha256').update(bytes).digest('hex')}`;
            if (digest !== artifact.digest) throw new Error('Studio archive digest mismatch.');
            writeFileSync('studio.zip', bytes);
            core.summary.addRaw(`Studio artifact ${artifact.id}, ${digest}\n`).write();
      - name: Validate and stage browser-only Studio
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
          PREVIEW_PREFIX: ${{ needs.build.outputs.path_prefix }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, stat, zipfile
          head, run, attempt = (os.environ[k] for k in ('HEAD_SHA', 'RUN_ID', 'RUN_ATTEMPT'))
          target = pathlib.Path('docs') / 'studio' / head / f'{run}-{attempt}'
          with zipfile.ZipFile('studio.zip') as archive:
              entries = archive.infolist()
              if len(entries) > 20000 or sum(e.file_size for e in entries) > 512 * 1024 * 1024:
                  raise ValueError('Studio archive exceeds deployment limits')
              paths = set()
              for entry in entries:
                  path = pathlib.PurePosixPath(entry.filename)
                  kind = stat.S_IFMT(entry.external_attr >> 16)
                  if (path.is_absolute() or '..' in path.parts or '\\' in entry.filename
                          or str(path) != entry.filename.rstrip('/')
                          or kind not in (0, stat.S_IFREG, stat.S_IFDIR)
                          or entry.filename in paths):
                      raise ValueError('Unsafe Studio archive entry')
                  paths.add(entry.filename)
              if archive.getinfo('build.json').file_size > 64 * 1024:
                  raise ValueError('Studio build metadata is too large')
              metadata = json.loads(archive.read('build.json'))
              expected = dict(version=1, headSha=head, checkoutSha=head,
                              repository=os.environ['REPOSITORY'],
                              runId=run, runAttempt=attempt,
                              prNumber=os.environ['PR_NUMBER'],
                              config='isomer-studio.config.ts', images=False,
                              data='examples-only; no live data')
              expected['base'] = f"{os.environ['PREVIEW_PREFIX']}/studio/{head}/{run}-{attempt}/"
              if any(type(metadata.get(k)) is not type(v) or metadata.get(k) != v for k, v in expected.items()):
                  raise ValueError('Studio build provenance mismatch')
              if 'index.html' not in paths or any(p.startswith('png/') for p in paths):
                  raise ValueError('Not a browser-only Studio')
              if target.exists():
                  raise ValueError('Studio deployment path already exists')
              archive.extractall(target)
          PY
      - uses: elastic/docs-actions/aws/auth@v1
        with:
          aws_role_name_prefix: codex-eng-preview-
      - name: AWS sync docs to S3
        id: s3-upload
        run: |
          aws configure set default.s3.max_concurrent_requests "${AWS_CLI_S3_MAX_CONCURRENT_REQUESTS}"
          aws configure set default.s3.max_queue_size "${AWS_CLI_S3_MAX_QUEUE_SIZE}"
          aws s3 sync docs "s3://elastic-codex-website-internal${PATH_PREFIX}" --delete --no-follow-symlinks --only-show-errors
          aws cloudfront create-invalidation \
            --distribution-id E1BSBYLPE05D2R \
            --paths "${PATH_PREFIX}" "${PATH_PREFIX}/*"
        env:
          PATH_PREFIX: ${{ needs.build.outputs.path_prefix }}
          AWS_RETRY_MODE: standard
          AWS_MAX_ATTEMPTS: 3
          AWS_CLI_S3_MAX_CONCURRENT_REQUESTS: 32
          AWS_CLI_S3_MAX_QUEUE_SIZE: 10000
      - name: Update deployment status
        uses: actions/github-script@v9
        if: always() && steps.deployment.outputs.result
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PATH_PREFIX: ${{ needs.build.outputs.path_prefix }}
        with:
          script:
            | # zizmor: ignore[template-injection] deployment_id from prior step output
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: "${{ steps.s3-upload.outcome == 'success' && 'success' || 'failure' }}",
              environment_url: `https://codex.elastic.dev${process.env.PATH_PREFIX}`,
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
      - name: Studio preview location
        if: steps.s3-upload.outcome == 'success'
        env:
          PATH_PREFIX: ${{ needs.build.outputs.path_prefix }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '### Studio preview (live verification pending)\nhttps://codex.elastic.dev%s/studio/%s/%s-%s/\n\nHead: `%s`. Verify JS/WASM/CSS/fonts and both themes before treating this as hosted browser evidence.\n' \
            "$PATH_PREFIX" "$HEAD_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"

  update-link-index:
    needs:
      - build
      - check
    permissions:
      id-token: write
    if: >
      needs.check.outputs.any_modified == 'true'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && contains(fromJSON('["push", "workflow_dispatch"]'), github.event_name)
      && github.event.repository.fork == false
    runs-on: ubuntu-slim
    steps:
      - uses: elastic/docs-actions/codex/update-link-index@v1
        with:
          codex-env: internal
