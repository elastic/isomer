name: docs

# PR builds are validated by ci.yml's docs-builder job and previewed by
# docs-preview.yml; this only publishes main.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Assemble package docs
        run: node scripts/assemble_package_docs.js
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Resolve docs prefix
        id: prefix
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          # base_path is "/isomer" for a public project page and "" for a
          # site served at its host root. docs-builder wants it unslashed.
          echo "value=${BASE_PATH#/}" >> "$GITHUB_OUTPUT"
      - name: Build documentation
        uses: elastic/docs-builder@main
        with:
          prefix: ${{ steps.prefix.outputs.value }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .artifacts/docs/html
      - id: deployment
        uses: actions/deploy-pages@v4
