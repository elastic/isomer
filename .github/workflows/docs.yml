name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v5
      - name: Assemble package docs
        run: node scripts/assemble_package_docs.js
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Resolve docs prefix
        id: prefix
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        # "/isomer" for a project page, "" for a site at its host root.
        run: echo "value=${BASE_PATH#/}" >> "$GITHUB_OUTPUT"
      - name: Build documentation
        uses: elastic/docs-builder@main
        with:
          prefix: ${{ steps.prefix.outputs.value }}
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: .artifacts/docs/html

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
