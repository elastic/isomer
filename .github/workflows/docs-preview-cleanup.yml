name: docs-preview-cleanup

# Pairs with docs-preview.yml. pull_request_target so this still runs with
# credentials once the PR's head branch is gone; it never checks out or runs
# any code from the PR.
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: none

jobs:
  destroy:
    name: Remove docs preview
    # Same gate as docs-preview.yml -- nothing to tear down while previews
    # aren't being published.
    if: vars.DOCS_PREVIEW_ENABLED == 'true' && github.event.repository.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: none
      deployments: write
      id-token: write
    steps:
      - name: Delete deployment records
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo
            const deployments = await github.rest.repos.listDeployments({
              owner,
              repo,
              environment: 'docs-preview',
              task: `docs-preview-${context.issue.number}`,
            })
            for (const deployment of deployments.data) {
              await github.rest.repos.createDeploymentStatus({
                owner,
                repo,
                deployment_id: deployment.id,
                state: 'inactive',
                description: 'Marking deployment as inactive',
              })
              await github.rest.repos.deleteDeployment({
                owner,
                repo,
                deployment_id: deployment.id,
              })
            }
      # The S3 prefix is an independent resource, so don't gate its removal on
      # the deployment records: those are deleted first, and gating on them
      # meant a failed `aws s3 rm` could never be retried -- the re-run would
      # find no records and skip the delete, orphaning the preview for good.
      # `aws s3 rm` on a missing prefix is a no-op, so this is safe to repeat.
      - uses: elastic/docs-builder/.github/actions/aws-auth@main
        if: always()
      - name: Delete S3 objects
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          aws s3 rm \
            "s3://elastic-docs-v3-website-preview/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}" \
            --recursive
