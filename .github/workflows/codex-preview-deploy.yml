name: elastic-internal-docs-preview-deploy

on:
  workflow_run:
    workflows:
      - elastic-internal-docs-build
    types:
      - completed

permissions:
  contents: none

jobs:
  preview:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    concurrency:
      group: codex-preview-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
      deployments: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Resolve originating pull request
        id: origin
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const repository = `${owner}/${repo}`;
            const run = await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id: context.payload.workflow_run.id,
            });
            if (
              run.data.name !== 'elastic-internal-docs-build' ||
              run.data.event !== 'pull_request' ||
              run.data.conclusion !== 'success' ||
              run.data.repository.full_name !== repository ||
              run.data.head_repository?.full_name !== repository ||
              run.data.pull_requests.length !== 1
            ) {
              throw new Error('The completed workflow run is not an eligible same-repository pull request build.');
            }
            const [pullRequest] = run.data.pull_requests;
            const pull = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullRequest.number,
            });
            if (
              pull.data.state !== 'open' ||
              pull.data.head.sha !== run.data.head_sha ||
              pull.data.head.repo?.full_name !== repository
            ) {
              throw new Error('The pull request is no longer eligible for a preview deployment.');
            }
            core.setOutput('head-sha', run.data.head_sha);
            core.setOutput('path-prefix', `/_preview/${repository}/pull/${pullRequest.number}`);
            core.setOutput('pr-number', pullRequest.number);
            core.setOutput('run-id', run.data.id);
      - name: Create deployment
        uses: actions/github-script@v9
        id: deployment
        env:
          HEAD_SHA: ${{ steps.origin.outputs.head-sha }}
          PR_NUMBER: ${{ steps.origin.outputs.pr-number }}
        with:
          result-encoding: string
          script: |
            const { owner, repo } = context.repo;
            const deployment = await github.rest.repos.createDeployment({
              owner,
              repo,
              environment: 'codex-preview',
              task: `codex-preview-${process.env.PR_NUMBER}`,
              ref: process.env.HEAD_SHA,
              auto_merge: false,
              transient_environment: true,
              required_contexts: [],
            });
            await github.rest.repos.createDeploymentStatus({
              deployment_id: deployment.data.id,
              owner,
              repo,
              state: 'in_progress',
              log_url: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
            });
            return deployment.data.id;
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          name: docs
          path: docs
          run-id: ${{ steps.origin.outputs.run-id }}
      - name: Reject symlinks in build output
        run: |
          if find docs -type l | grep -q .; then
            echo "::error::Symlinks found in build output — refusing to deploy"
            find docs -type l -ls
            exit 1
          fi
      - uses: elastic/docs-actions/aws/auth@v1
        with:
          aws_role_name_prefix: codex-eng-preview-
      - name: Upload preview
        id: s3-upload
        env:
          AWS_CLI_S3_MAX_CONCURRENT_REQUESTS: 32
          AWS_CLI_S3_MAX_QUEUE_SIZE: 10000
          AWS_MAX_ATTEMPTS: 3
          AWS_RETRY_MODE: standard
          PATH_PREFIX: ${{ steps.origin.outputs.path-prefix }}
        run: |
          aws configure set default.s3.max_concurrent_requests "${AWS_CLI_S3_MAX_CONCURRENT_REQUESTS}"
          aws configure set default.s3.max_queue_size "${AWS_CLI_S3_MAX_QUEUE_SIZE}"
          aws s3 sync docs "s3://elastic-codex-website-internal${PATH_PREFIX}" --delete --no-follow-symlinks --only-show-errors
          aws cloudfront create-invalidation \
            --distribution-id E1BSBYLPE05D2R \
            --paths "${PATH_PREFIX}" "${PATH_PREFIX}/*"
      - name: Update deployment status
        if: always() && steps.deployment.outputs.result
        uses: actions/github-script@v9
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.result }}
          PATH_PREFIX: ${{ steps.origin.outputs.path-prefix }}
          UPLOAD_OUTCOME: ${{ steps.s3-upload.outcome }}
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.repos.createDeploymentStatus({
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              owner,
              repo,
              state: process.env.UPLOAD_OUTCOME === 'success' ? 'success' : 'failure',
              environment_url: `https://codex.elastic.dev${process.env.PATH_PREFIX}`,
              log_url: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
            });
