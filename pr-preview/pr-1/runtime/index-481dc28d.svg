<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1148.672 318" width="1148.672" height="318" style="--bg:#FFFFFF;--fg:#000000;--accent:#3b82f6">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: 'ui-monospace\2C  SFMono-Regular\2C  Menlo\2C  Monaco\2C  Consolas\2C  \27 Liberation Mono\27 \2C  \27 Courier New\27 \2C  monospace', ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 55%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 35%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 20%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 32%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 3%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--fg) 4%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 8%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 3px rgba(0,0,0,.07)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px rgba(0,0,0,.04)); }
  .cls-note rect, .cls-note polygon, .cls-note circle, .cls-note ellipse { fill: #e8f1ff; stroke: #a3cbff; }
  .cls-note text { fill: #154399; }
  .cls-tip rect, .cls-tip polygon, .cls-tip circle, .cls-tip ellipse { fill: #e2f9f7; stroke: #77e5e0; }
  .cls-tip text { fill: #065b58; }
  .cls-warning rect, .cls-warning polygon, .cls-warning circle, .cls-warning ellipse { fill: #fdf3d8; stroke: #facb3d; }
  .cls-warning text { fill: #6a4906; }
  .cls-important rect, .cls-important polygon, .cls-important circle, .cls-important ellipse { fill: #f3ecfe; stroke: #d1bafc; }
  .cls-important text { fill: #52357e; }
  .cls-caution rect, .cls-caution polygon, .cls-caution circle, .cls-caution ellipse { fill: #ffefe9; stroke: #ffc1aa; }
  .cls-caution text { fill: #8a3825; }
  .cls-error rect, .cls-error polygon, .cls-error circle, .cls-error ellipse { fill: #ffe8e5; stroke: #ffb5ad; }
  .cls-error text { fill: #7f1f27; }
  .cls-success rect, .cls-success polygon, .cls-success circle, .cls-success ellipse { fill: #e2f8f0; stroke: #88e3c3; }
  .cls-success text { fill: #0c5a3f; }
  .cls-plain rect, .cls-plain polygon, .cls-plain circle, .cls-plain ellipse { fill: #f6f9fc; stroke: #bdc2ca; }
  .cls-plain text { fill: #464c56; }
  .cls-highlight rect, .cls-highlight polygon, .cls-highlight circle, .cls-highlight ellipse { fill: #d9e8ff; stroke: #3788ff; }
  .cls-highlight text { fill: #123778; }
  @media (prefers-color-scheme: dark) {
    .cls-note rect, .cls-note polygon, .cls-note circle, .cls-note ellipse { fill: #000917; stroke: #00285C; }
    .cls-note text { fill: #6694EA; }
    .cls-tip rect, .cls-tip polygon, .cls-tip circle, .cls-tip ellipse { fill: #061D1B; stroke: #1A8883; }
    .cls-tip text { fill: #A4F9F6; }
    .cls-warning rect, .cls-warning polygon, .cls-warning circle, .cls-warning ellipse { fill: #271D02; stroke: #C29305; }
    .cls-warning text { fill: #F9D895; }
    .cls-important rect, .cls-important polygon, .cls-important circle, .cls-important ellipse { fill: #080113; stroke: #1A0345; }
    .cls-important text { fill: #9E81CA; }
    .cls-caution rect, .cls-caution polygon, .cls-caution circle, .cls-caution ellipse { fill: #160600; stroke: #551700; }
    .cls-caution text { fill: #DA8875; }
    .cls-error rect, .cls-error polygon, .cls-error circle, .cls-error ellipse { fill: #1A0300; stroke: #520800; }
    .cls-error text { fill: #E08088; }
    .cls-success rect, .cls-success polygon, .cls-success circle, .cls-success ellipse { fill: #071D15; stroke: #1C7757; }
    .cls-success text { fill: #A5F3D8; }
    .cls-plain rect, .cls-plain polygon, .cls-plain circle, .cls-plain ellipse { fill: #030609; stroke: #353A42; }
    .cls-plain text { fill: #A9AFB9; }
    .cls-highlight rect, .cls-highlight polygon, .cls-highlight circle, .cls-highlight ellipse { fill: #000F26; stroke: #0051C8; }
    .cls-highlight text { fill: #87ACED; }
  }
</style>

<defs>
